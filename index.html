  <script>
  (function() {
    // 1. URL de destino a donde quieres enviar al usuario móvil
    var targetUrl = "https://materialillos024525404.vercel.app";
 
    // 2. Detección por User-Agent (detecta dispositivos móviles y tablets)
    var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(navigator.userAgent);
 
    // 3. Detección complementaria por ancho de pantalla o toque
    var isMobileScreen = window.matchMedia("(max-width: 768px)").matches;
    var isTouchDevice = ('ontouchend' in document) || (navigator.maxTouchPoints > 0);
 
    // 4. Si cumple los criterios de móvil, redirigir instantáneamente
    if (isMobileUA || (isMobileScreen && isTouchDevice)) {
      window.location.replace(targetUrl);
    }
  })();
</script>
